name: Webhook Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger webhook worker
        env:
          WORKER_URL: https://arcport.xyz/api/webhook-worker
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X GET "$WORKER_URL" \
            -H "Authorization: Bearer $CRON_SECRET"
