<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcPort — API Marketplace on Arc</title>
<meta name="description" content="Pay-per-call Pay-per-call API gateway built on Arc. $0.001 USDC per request, settled in under 350ms.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* ARC-inspired: deep navy, not pure black */
  --bg:    #0a0e1a;
  --bg1:   #0d1120;
  --bg2:   #111728;
  --bg3:   #161d30;
  --bg4:   #1c2438;
  --bg5:   #232c44;

  /* Borders — subtle blue tint */
  --b1: rgba(99,130,255,0.10);
  --b2: rgba(99,130,255,0.16);
  --b3: rgba(99,130,255,0.24);

  /* Text */
  --t1: #f0f2ff;
  --t2: #8b93b8;
  --t3: #4f5880;
  --t4: #2e3554;

  /* ARC blue — the main accent */
  --blue:   #4b8bff;
  --blue2:  #6ba3ff;
  --blue-d: rgba(75,139,255,0.08);
  --blue-b: rgba(75,139,255,0.18);
  --blue-g: rgba(75,139,255,0.30);

  /* Status */
  --grn:   #34d399;
  --grn-d: rgba(52,211,153,0.08);
  --grn-b: rgba(52,211,153,0.18);
  --red:   #f87171;
  --red-d: rgba(248,113,113,0.08);
  --red-b: rgba(248,113,113,0.18);
  --amb:   #fbbf24;
  --amb-d: rgba(251,191,36,0.08);

  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
  --r:  6px;
  --r2: 10px;
  --r3: 14px;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--t1);
  font-size: 13.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  /* Subtle noise texture like ARC */
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

/* ── Layout ──────────────────────────────── */
.shell { display: flex; min-height: 100vh; }

/* ── Sidebar ─────────────────────────────── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg1);
  border-right: 1px solid var(--b1);
  position: fixed;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  z-index: 100;
}

.brand {
  padding: 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--b1);
  cursor: pointer;
}

.brand-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(75,139,255,0.28);
